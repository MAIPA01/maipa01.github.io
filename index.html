<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAIPA — Patryk Antosik · Game & Graphics Programmer</title>
  <meta name="description" content="Portfolio of Patryk Antosik (MAIPA): games, custom game engines and renderers, Unity, Unreal Engine and 3D modeling.">
  <meta property="og:title" content="MAIPA — Patryk Antosik">
  <meta property="og:description" content="Games, game engines, rendering and 3D models. This portfolio is playable.">
  <meta property="og:image" content="images/renders/challenger/front.webp">
  <meta name="theme-color" content="#d11717">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="images/icon.webp">
  <script>try{var m=JSON.parse(localStorage.getItem('maipa-theme'));document.documentElement.dataset.theme=m||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="page-home">
  <!--
    Header, footer and dialogs are added by js/core/ (chrome.js, media.js) — same on every page.
    TRANSLATIONS: data-i18n="key" → text from data/i18n/<language>.json;
    data-i18n-attr="attribute:key; attribute2:key2" translates attributes.
  -->

  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-inner">
      <p class="pixel-label" data-i18n="hero.greeting">&gt; hello world_</p>
      <h1 class="hero-title" data-bind="brand">MAIPA</h1>
      <p class="hero-name" data-bind="name">Patryk Antosik</p>
      <p class="hero-role"><span class="hero-role-box"><span class="role-text"></span><span class="caret">_</span></span></p>
      <p class="hero-tagline" data-bind="tagline"></p>
      <div class="hero-actions">
        <a href="#projects" class="btn btn-outline" data-i18n="hero.seeProjects">See projects</a>
        <button type="button" class="btn-pixel btn-pixel-lg play-toggle" data-i18n="hero.play">Play this page</button>
      </div>
    </div>
    <a href="#about" class="scroll-hint" data-i18n-attr="aria-label:hero.scroll" aria-label="Scroll down"><span></span></a>
  </section>

  <main id="main">
    <!-- ABOUT -->
    <section class="section" id="about">
      <div class="container">
        <div class="section-head">
          <h2 class="title" data-i18n="sections.about.title">About</h2>
          <p class="subtitle" data-i18n="sections.about.subtitle">me</p>
        </div>
        <div class="about-grid">
          <div class="about-text">
            <div class="about-paragraphs"></div>
            <div class="stats"></div>
          </div>
          <figure class="about-avatar">
            <img alt="" loading="lazy">
            <figcaption></figcaption>
          </figure>
        </div>
        <div class="skills"></div>
      </div>
    </section>

    <section class="band band-1" aria-hidden="true">
      <h2 class="title" data-i18n="sections.projectsBand.title">Projects</h2>
      <p class="subtitle" data-i18n="sections.projectsBand.subtitle"></p>
    </section>

    <!-- PROJECTS -->
    <section class="section section-alt" id="projects">
      <div class="container">
        <div class="section-head">
          <h2 class="title" data-i18n="sections.projects.title">Projects</h2>
          <p class="subtitle" data-i18n="sections.projects.subtitle"></p>
        </div>
        <div class="filters" role="toolbar" data-i18n-attr="aria-label:projects.filterLabel"></div>
        <div class="projects-grid"></div>
      </div>
    </section>

    <section class="band band-2" aria-hidden="true">
      <h2 class="title" data-i18n="sections.modelsBand.title">3D</h2>
      <p class="subtitle" data-i18n="sections.modelsBand.subtitle"></p>
    </section>

    <!-- 3D MODELS -->
    <section class="section section-dark" id="models">
      <div class="container">
        <div class="section-head">
          <h2 class="title" data-i18n="sections.models.title">3D Models</h2>
          <p class="subtitle" data-i18n="sections.models.subtitle"></p>
        </div>
        <div class="models-grid"></div>
      </div>
    </section>

    <!-- CHARACTERS -->
    <section class="section section-alt" id="characters">
      <div class="container">
        <div class="section-head">
          <h2 class="title" data-i18n="sections.characters.title">Characters</h2>
          <p class="subtitle" data-i18n="sections.characters.subtitle"></p>
        </div>
        <p class="section-text" data-i18n="sections.characters.text"></p>
        <div class="characters-grid"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section" id="contact">
      <div class="container">
        <div class="section-head">
          <h2 class="title" data-i18n="sections.contact.title">Contact</h2>
          <p class="subtitle" data-i18n="sections.contact.subtitle"></p>
        </div>
        <p class="section-text contact-text" data-i18n="sections.contact.text"></p>
        <div class="socials"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
